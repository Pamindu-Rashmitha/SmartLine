<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="slGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="slShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Premium Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#slGrad)" />

  <!-- Inner Layers / Line Financial Mark -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(12, 12)">
    <!-- Top Rhombus -->
    <polygon points="20 4 4 12 20 20 36 12 20 4" fill="rgba(255,255,255,0.15)" />
    <!-- Middle Tier Line -->
    <polyline points="4 20 20 28 36 20" />
    <!-- Bottom Tier Line -->
    <polyline points="4 28 20 36 36 28" />
  </g>
</svg>
